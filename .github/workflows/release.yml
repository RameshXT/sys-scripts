name: Build & Release xtkeys

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Branch Name for Tag
        shell: bash
        run: |
          CLEANED_BRANCH=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "DEV_TAG=dev-$CLEANED_BRANCH" >> $GITHUB_ENV

      - name: Import Code-Signing Certificate
        if: ${{ secrets.CERTIFICATE_BASE64 != '' }}
        shell: powershell
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          $pfx = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certBytes, $env:CERTIFICATE_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new([System.Security.Cryptography.X509Certificates.StoreName]::My, [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
          $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $store.Add($pfx)
          $store.Close()
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNING_CERT_THUMBPRINT=$($pfx.Thumbprint)"
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Run Build Script
        shell: powershell
        run: .\build.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (github.ref_name == 'main' && 'latest' || env.DEV_TAG) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || (github.ref_name == 'main' && 'Latest' || format('Dev Release - {0}', github.ref_name)) }}
          body: |
            ## Install

            Run this in any PowerShell window on any Windows machine:

            ```powershell
            irm https://github.com/${{ github.repository }}/releases/download/${{ github.ref_type == 'tag' && github.ref_name || (github.ref_name == 'main' && 'latest' || env.DEV_TAG) }}/install.ps1 | iex
            ```

            ## What's included
            | File | Description |
            |---|---|
            | `hotkeys.ahk` | The AutoHotkey script |
            | `hotkeys.sha256` | SHA-256 checksum for verification |
            | `install.ps1` | The one-time installer script |
            | `xtkeys.ps1` | Runtime management CLI tool |
            | `hotkeys.zip` | Full bundle (ahk + installer) |

            ---
            Built from commit `${{ github.sha }}` · run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            dist/hotkeys.ahk
            dist/hotkeys.sha256
            dist/install.ps1
            dist/xtkeys.ps1
            dist/hotkeys.zip
          draft: false
          prerelease: ${{ github.ref_name != 'main' && github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_name == 'main' || github.ref_type == 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update 'latest' git tag to current commit
        if: github.ref_type != 'tag' && github.ref_name == 'main'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push origin latest --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
